services:
  model-inference-grpc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"  # gRPC port
    networks:
      - inference-network
    environment:
      - "DB_HOST=database"
      - "DB_USER=serverdata"
      - "DB_PASSWORD=server123"
      - "DB_NAME=chronic"
      - "DB_PORT=5432"
      - "ONNX_MODEL_PATH="
      - "CLASS_DICTIONARY_PATH="
    depends_on:
      - database

  model-inference-rest:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8088"  # REST API port
    networks:
      - inference-network
    environment:
      - "REST_MODE=true"
      - "DB_HOST=database"
      - "DB_USER=serverdata"
      - "DB_PASSWORD=server123"
      - "DB_NAME=chronic"
      - "DB_PORT=5432"
      - "ONNX_MODEL_PATH="
      - "CLASS_DICTIONARY_PATH="
    depends_on:
      - database

  database:
    image: postgres:16-alpine
    ports:
      - "5432:5434"
    networks:
      - inference-network
    environment:
      - POSTGRES_DB=chronic
      - POSTGRES_USER=serverdata
      - POSTGRES_PASSWORD=server123
    volumes:
      - db:/var/lib/postgresql/data

networks:
  inference-network:
    driver: bridge


volumes:
  db:
